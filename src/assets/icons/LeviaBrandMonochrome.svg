<svg viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- LEVIA Brand Icon — Versão Monocromática (Branco/Marfim) -->
  <!-- Use em fundos escuros ou como alternativa minimista -->
  
  <!-- Pena (branco/marfim) -->
  <g>
    <!-- Forma principal da pena -->
    <path
      d="M 128 40 
         C 128 40, 110 60, 110 95 
         C 110 130, 120 150, 130 170 
         C 135 180, 140 185, 145 190 
         L 148 195 
         C 148 195, 145 185, 145 170 
         C 145 155, 150 140, 160 140 
         C 170 140, 175 155, 175 170 
         C 175 185, 172 195, 172 195 
         L 175 190 
         C 185 170, 195 150, 195 95 
         C 195 60, 177 40, 128 40 Z"
      fill="#FFFFFF"
      stroke="none"
    />
    
    <!-- Detalhe da raque (linha central) -->
    <path
      d="M 128 50 Q 130 90, 128 150"
      stroke="#F5F0E8"
      stroke-width="2.5"
      fill="none"
      stroke-linecap="round"
    />
    
    <!-- Pequenas penas secundárias (lado esquerdo) -->
    <path
      d="M 115 120 Q 105 125, 100 135"
      stroke="#F5F0E8"
      stroke-width="2"
      fill="none"
      stroke-linecap="round"
      opacity="0.6"
    />
    
    <!-- Pequenas penas secundárias (lado direito) -->
    <path
      d="M 141 125 Q 150 130, 158 140"
      stroke="#F5F0E8"
      stroke-width="2"
      fill="none"
      stroke-linecap="round"
      opacity="0.6"
    />
  </g>
  
  <!-- Ponto (branco) -->
  <circle cx="165" cy="185" r="12" fill="#FFFFFF" opacity="0.95"/>
</svg>
