name: Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build www
        run: npm run build

      - name: Validate build output
        run: |
          if [ ! -d "www" ] || [ -z "$(ls -A www/)" ]; then
            echo "Error: www directory is empty or missing"
            exit 1
          fi
          if [ ! -f "www/index.html" ]; then
            echo "Error: www/index.html not found"
            exit 1
          fi
          echo "Build validation passed"

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@v3.63.0
        with:
          path: ./
          base: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          head: ${{ github.event.pull_request.head.ref || 'HEAD' }}
          extra_args: --debug
