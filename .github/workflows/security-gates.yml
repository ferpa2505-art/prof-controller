name: Security gates

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: security-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Build web artifact
        run: npm run build
      - name: Check JavaScript syntax
        run: |
          node --check scripts/build-www.mjs
          node --check scripts/check-workflow-security.mjs
          node --check scripts/security.test.mjs
          find www -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  dependency_audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Audit root manifest
        run: npm audit --package-lock-only --audit-level=high
      - name: Audit retained legacy manifest
        working-directory: legacy/server
        run: npm audit --package-lock-only --audit-level=high

  secret_scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Scan repository history and changes
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  security_tests:
    name: Security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node --test scripts/security.test.mjs

  workflow_policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/check-workflow-security.mjs
