# Gera o instalador Windows (.exe) da versão Electron.
#
# Rota recomendada para a Microsoft Store é o PWABuilder (ver docs/PUBLICAR-WINDOWS.md):
# não precisa de certificado e se atualiza sozinho com o GitHub Pages.
# Este workflow serve para quem quer distribuir um .exe fora da Store.
# Sem certificado de assinatura de código, o Windows mostra o aviso do SmartScreen.

name: App Windows (Electron)

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['loja/**']

permissions:
  contents: read

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Testes de segurança
        run: npm run test:security

      - name: Procurar segredos expostos
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57c68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  build:
    needs: security
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Montar www/ e gerar instalador
        run: npm run electron:build:win -- --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: prof-controller-windows-${{ github.run_number }}
          path: release/*.exe
          retention-days: 30
