# Publica o app no GitHub Pages a cada push na main.
#
# Antes publicava a raiz inteira do repositório (documentação, scripts, código de
# servidor). Agora monta a pasta www/ com scripts/build-www.mjs e publica só ela.
# O build também grava a versão do cache no service worker automaticamente.

name: Publicar no GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Testes de segurança
        run: npm run test:security

      - name: Procurar segredos expostos
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  build:
    name: Build
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Montar www/
        run: node scripts/build-www.mjs

      - name: Conferir sintaxe do JavaScript
        run: |
          for f in $(find www -name '*.js'); do node --check "$f"; done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: www

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: pages-artifact
          digest-mismatch: error

      - name: Verify downloaded artifact
        run: |
          mkdir pages-site
          tar -xf pages-artifact/artifact.tar -C pages-site
          node --input-type=module -e "import { verifyIntegrity } from './scripts/build-www.mjs'; await verifyIntegrity('pages-site');"

      - id: deployment
        uses: actions/deploy-pages@v5
