# Publica o app no GitHub Pages a cada push na main.
#
# Antes publicava a raiz inteira do repositório (documentação, scripts, código de
# servidor). Agora monta a pasta www/ com scripts/build-www.mjs e publica só ela.
# O build também grava a versão do cache no service worker automaticamente.
#
# O job "verificar" confere o que o site público está servindo de verdade: se o
# Pages estiver configurado como "Deploy from a branch" (main / root), o deploy
# abaixo "passa" mas o site continua entregando a raiz, com o service worker em
# modo 'dev' e sem pré-cache. Nesse caso o job falha e diz o que configurar.
# Guia: docs/PUBLICAR-SITE.md

name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Montar www/
        run: node scripts/build-www.mjs

      - name: Conferir sintaxe do JavaScript
        run: |
          for f in $(find www -name '*.js'); do node --check "$f"; done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  verificar:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Descobrir o BUILD_ID que deveria estar publicado
        id: build
        run: |
          node scripts/build-www.mjs
          BUILD_ID=$(grep -o 'const BUILD_ID = "[^"]*"' www/service-worker.js | cut -d'"' -f2)
          echo "Publicado esperado: $BUILD_ID"
          echo "esperado=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Conferir o que o site público está servindo
        env:
          URL: https://ferpa2505-art.github.io/prof-controller
          ESPERADO: ${{ steps.build.outputs.esperado }}
        run: |
          set -u
          for tentativa in 1 2 3 4 5 6 7 8; do
            SW=$(curl -fsS "$URL/service-worker.js?cb=$RANDOM$RANDOM" || true)
            if printf '%s' "$SW" | grep -qF "const BUILD_ID = \"$ESPERADO\""; then
              for arquivo in index.html app.js manifest.json; do
                curl -fsS -o /dev/null "$URL/$arquivo" || {
                  echo "::error::$URL/$arquivo não responde."
                  exit 1
                }
              done
              echo "✔ O site está publicando o www/ gerado (BUILD_ID $ESPERADO)."
              exit 0
            fi
            echo "Tentativa $tentativa/8 — publicado: $(printf '%s' "$SW" | grep -o 'const BUILD_ID = [^;]*' | head -1)"
            sleep 20
          done

          echo "::error::O GitHub Pages não está publicando o www/ gerado (deploy 'success' não garante publicação)."
          echo "::error::Settings → Pages → Build and deployment → Source precisa ser 'GitHub Actions'."
          echo "::error::Como corrigir e conferir: docs/PUBLICAR-SITE.md"
          if curl -fsS -o /dev/null "$URL/package.json"; then
            echo "::error::O site está servindo a raiz do repositório: $URL/package.json responde 200."
          fi
          exit 1
