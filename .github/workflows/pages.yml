# Publica o app no GitHub Pages a cada push na main.
#
# Antes publicava a raiz inteira do repositório (documentação, scripts, código de
# servidor). Agora monta a pasta www/ com scripts/build-www.mjs e publica só ela.
# O build também grava a versão do cache no service worker automaticamente.

name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Montar www/
        run: node scripts/build-www.mjs

      - name: Conferir sintaxe do JavaScript
        run: |
          for f in $(find www -name '*.js'); do node --check "$f"; done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
