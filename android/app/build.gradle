apply plugin: 'com.android.application'

// Versão do app:
// versionName vem do package.json (ex: "1.2.0").
// versionCode é um número inteiro positivo (1 <= versionCode <= 2100000000)
// estritamente crescente para publicações na Google Play Console.
//
// Estratégia monotônica calculada a partir do semver:
//   versionCode = (MAJOR * 1000000) + (MINOR * 10000) + (PATCH * 100) + BUILD
//   Exemplo: 1.2.0 build 0 -> 1020000; 1.2.1 build 0 -> 1020100.
// É possível sobrescrever com -PversionCode=NN ou variável de ambiente VERSION_CODE.
def pkg = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def appVersionName = pkg.version?.toString() ?: '1.0.0'

def defaultVersionCode = 1
def semverMatcher = (appVersionName =~ /^(\d+)\.(\d+)\.(\d+)/)
if (semverMatcher.find()) {
    def major = semverMatcher.group(1).toInteger()
    def minor = semverMatcher.group(2).toInteger()
    def patch = semverMatcher.group(3).toInteger()
    def buildNum = (project.findProperty('buildNumber') ?: System.getenv('BUILD_NUMBER') ?: '0').toString().toInteger()
    defaultVersionCode = (major * 1000000) + (minor * 10000) + (patch * 100) + buildNum
}

def rawVersionCode = project.findProperty('versionCode') ?: System.getenv('VERSION_CODE') ?: defaultVersionCode
def appVersionCode
try {
    appVersionCode = rawVersionCode.toString().toInteger()
} catch (Exception e) {
    throw new GradleException("Invalid versionCode '${rawVersionCode}': must be a valid integer.")
}

if (appVersionCode <= 0) {
    throw new GradleException("Invalid versionCode ${appVersionCode}: Google Play requires a positive integer (>= 1).")
}
if (appVersionCode > 2100000000) {
    throw new GradleException("Invalid versionCode ${appVersionCode}: exceeds Google Play maximum limit of 2100000000.")
}

// Assinatura de release: lida de android/keystore.properties (local, fora do git)
// ou de variáveis de ambiente (GitHub Actions). Sem isso, gera release sem assinatura.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) { keystorePropsFile.withInputStream { keystoreProps.load(it) } }
def signingValue = { String prop, String env -> keystoreProps.getProperty(prop) ?: System.getenv(env) }

android {
    namespace = "com.profcontroller.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.profcontroller.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def storePath = signingValue('storeFile', 'ANDROID_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (signingValue('storeFile', 'ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
